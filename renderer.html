<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Controller canvas</title><link rel="stylesheet" href="/controller.css"></head><body><div id="controller" class="controller xbox">

<img class="uploaded-art" alt="Custom controller artwork" hidden>
<div class="triggers"><div class="trigger left" data-control="lt" data-button="6" aria-label="Left trigger"><span>LT</span></div><div class="trigger right" data-control="rt" data-button="7" aria-label="Right trigger"><span>RT</span></div></div>
<div class="bumpers"><div class="bumper left" data-control="lb" data-button="4" aria-label="Left bumper"><span>LB</span></div><div class="bumper right" data-control="rb" data-button="5" aria-label="Right bumper"><span>RB</span></div></div>
<div class="quadrant p0"></div><div class="arrows"><div class="back" data-control="back" data-button="8" aria-label="Back"><span>▱</span></div><div class="start" data-control="start" data-button="9" aria-label="Start"><span>☰</span></div></div>
<div class="abxy"><div class="button a" data-control="a" data-button="0" aria-label="A button"><span>A</span></div><div class="button b" data-control="b" data-button="1" aria-label="B button"><span>B</span></div><div class="button x" data-control="x" data-button="2" aria-label="X button"><span>X</span></div><div class="button y" data-control="y" data-button="3" aria-label="Y button"><span>Y</span></div></div>
<div class="sticks"><div class="stick left" data-control="ls" data-button="10" aria-label="Left stick"><span></span></div><div class="stick right" data-control="rs" data-button="11" aria-label="Right stick"><span></span></div></div>
<div class="dpad"><div class="face up" data-control="up" data-button="12" aria-label="D-pad up"><span>▲</span></div><div class="face down" data-control="down" data-button="13" aria-label="D-pad down"><span>▼</span></div><div class="face left" data-control="left" data-button="14" aria-label="D-pad left"><span>◀</span></div><div class="face right" data-control="right" data-button="15" aria-label="D-pad right"><span>▶</span></div></div></div><style id="designStyle"></style><style id="legacyStyle"></style><script type="module" src="/renderer.js"></script></body></html>
